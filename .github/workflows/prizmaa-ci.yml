name: PRIZMAA validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prizmaa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and member-security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Ensure no simulated institutional inquiry receipt
        shell: bash
        run: |
          if grep -Fq 'INQUIRY RECEIVED' app/page.tsx; then
            echo "::error::The landing page may be claiming to receive inquiries without durable delivery."
            exit 1
          fi
      - name: Member safety and permission tests
        run: npm test
      - name: Consent-based member learning and privacy regression tests
        run: npm run test:member
      - name: Adaptive quality learning tests (no production data)
        run: npm run test:learning
      - name: Self-repair safety and rollback contract tests
        run: npm run test:repair
      - name: Unified PRIZMAA infrastructure integration checks
        run: npm run test:architecture
      - name: Next.js production build
        run: npm run build

  public-runtime:
    name: Independent public beta and anonymous access probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI: 'true'
    steps:
      - name: Checkout immutable PR revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Independently verify real public pages, Auth health, and private table denial
        run: node scripts/probe-prizmaa-public.mjs
