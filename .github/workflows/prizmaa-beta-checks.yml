name: PRIZMAA private beta checks
on:
  pull_request:
    paths:
      - 'app/prizmaa/**'
      - 'app/api/prizmaa/**'
      - 'lib/prizmaa/**'
      - 'scripts/test-prizmaa.mjs'
      - 'scripts/prizmaa-http-smoke.mjs'
      - 'scripts/test-prizmaa-intelligence.mjs'
      - 'lib/prizmaa/intelligence.ts'
      - 'package*.json'
      - '.github/workflows/prizmaa-beta-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # No real accounts or payments. The sandboxed test runner sets PRIZMAA_DB_PATH.
      PRIZMAA_LOCAL_MVP: '1'
    steps:
      - name: Checkout reviewed PR code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Type check
        run: npx tsc --noEmit
      - name: Test private beta store
        run: npm test
      - name: Explainable Gay Intelligence unit tests
        run: node --experimental-strip-types scripts/test-prizmaa-intelligence.mjs
      - name: Production build check (not deployment)
        run: npm run build
      - name: Private-only UI / API HTTP integration smoke
        env:
          PRIZMAA_DB_PATH: /tmp/prizmaa-http-smoke.sqlite
        run: |
          set -euo pipefail
          npm run start -- -p 3055 -H 127.0.0.1 > /tmp/prizmaa-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3055/prizmaa/beta >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/prizmaa-next.log
            exit 1
          fi
          node scripts/prizmaa-http-smoke.mjs
