name: PRIZMAA private beta checks
on:
  pull_request:
    paths:
      - 'app/prizmaa/**'
      - 'app/api/prizmaa/**'
      - 'lib/prizmaa/**'
      - 'scripts/test-prizmaa.mjs'
      - 'package*.json'
      - '.github/workflows/prizmaa-beta-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # No real accounts or payments. The sandboxed test runner sets PRIZMAA_DB_PATH.
      PRIZMAA_LOCAL_MVP: '1'
    steps:
      - name: Checkout reviewed PR code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Type check
        run: npx tsc --noEmit
      - name: Test private beta store
        run: npm test
      - name: Production build check (not deployment)
        run: npm run build
