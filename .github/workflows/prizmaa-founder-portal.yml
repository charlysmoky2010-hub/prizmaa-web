name: PRIZMAA Founder Portal Gate
on:
  pull_request:
    paths:
      - 'founder-portal/**'
      - '.github/workflows/prizmaa-founder-portal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate browser JavaScript syntax
        run: node --check founder-portal/founder.js
      - name: Test invitation and isolation contracts
        run: node --test founder-portal/tests/portal.test.mjs
